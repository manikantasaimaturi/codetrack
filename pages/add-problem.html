<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CodeTrack | Add Problem</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head>
<body><header class="navbar"><a href="../index.html" class="logo"><span>&lt;/&gt;</span> CodeTrack</a><nav><a href="../index.html">Dashboard</a><a href="problems.html">Problems</a><a href="add-problem.html" class="active">Add Problem</a><a href="revision.html">Revision</a><a href="analytics.html">Analytics</a></nav><button id="themeBtn" class="theme-btn">☀️</button></header>
<main class="container"><section class="page-heading"><p class="eyebrow">PRACTICE TRACKER</p><h1>Add Coding Problem</h1><p>Record a problem you've solved or want to practice.</p></section>
<section class="form-container"><form id="problemForm">
<div class="form-group"><label>Problem Name *</label><input type="text" id="problemName" placeholder="Example: Two Sum" required></div>
<div class="form-row"><div class="form-group"><label>Platform</label><select id="platform"><option>LeetCode</option><option>GeeksForGeeks</option><option>CodeChef</option><option>HackerRank</option><option>Other</option></select></div>
<div class="form-group"><label>Difficulty</label><select id="difficulty"><option>Easy</option><option>Medium</option><option>Hard</option></select></div></div>
<div class="form-group"><label>Topic</label><select id="topic"><option>Arrays</option><option>Strings</option><option>Linked Lists</option><option>Stack</option><option>Queue</option><option>Trees</option><option>Graphs</option><option>Dynamic Programming</option></select></div>
<div class="form-group"><label>Status</label><select id="status"><option>Solved</option><option>Unsolved</option><option>Revision</option></select></div>
<div class="form-group"><label>Problem URL</label><input type="url" id="problemUrl" placeholder="https://..."></div>
<div class="form-group"><label>Notes</label><textarea id="notes" placeholder="Write your approach, mistakes or important points..."></textarea></div>
<button type="submit" class="btn">Save Problem</button></form></section></main>
<script src="../js/data.js"></script><script src="../js/add-problem.js"></script></body></html>
